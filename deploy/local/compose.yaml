name: ezllmrouter-dev06-local
services:
  credential-init:
    profiles: [setup]
    image: ${EZLLMROUTER_SERVICE_IMAGE:?}
    pull_policy: never
    network_mode: none
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    volumes: ["credential_data:/run/ezllmrouter"]
    command: ["python", "-B", "/app/local/initialize_credentials.py"]
  netns:
    image: ${EZLLMROUTER_PYTHON_IMAGE:?}
    pull_policy: never
    networks: [local_private]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "-c", "import time; time.sleep(999999)"]
  receiver:
    image: ${EZLLMROUTER_RECEIVER_IMAGE:?}
    pull_policy: never
    network_mode: service:netns
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes: ["receiver_data:/data"]
    environment: {EZLLMROUTER_RECEIVER_LOG: /data/arrivals.jsonl}
    depends_on: [netns]
  worker:
    image: ${EZLLMROUTER_WORKER_IMAGE:?}
    pull_policy: never
    network_mode: none
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 15s
    volumes:
      - worker_link_data:/link/worker
      - sender_link_data:/link/sender:ro
  service:
    init: true
    stop_grace_period: 330s
    image: ${EZLLMROUTER_SERVICE_IMAGE:?}
    pull_policy: never
    network_mode: service:netns
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - service_data:/data
      - worker_link_data:/link/worker:ro
      - sender_link_data:/link/sender
      - console_link_data:/console
      - credential_data:/run/ezllmrouter:ro
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
    depends_on: [netns, receiver, worker]
  ingress:
    image: ${EZLLMROUTER_PYTHON_IMAGE:?}
    pull_policy: never
    networks: [console_publish]
    ports: ["127.0.0.1:8780:8780"]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "${EZLLMROUTER_INGRESS_SCRIPT:?}:/console_ingress.py:ro"
      - "${EZLLMROUTER_INGRESS_RESOURCES:?}:/runtime_resources.py:ro"
      - console_link_data:/console
    command: ["python", "-B", "/console_ingress.py"]
    depends_on: [netns, service]
volumes:
  credential_data:
  receiver_data:
  service_data:
  worker_link_data:
  sender_link_data:
  console_link_data:
networks:
  local_private:
    internal: true
  console_publish:
