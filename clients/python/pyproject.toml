[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[project]
name = "cognitivedynamics-ezllmrouter-client"
version = "0.3.0"
description = "CognitiveDynamics EzLLMRouter synchronous network client"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "httpcore==1.0.9"]
classifiers = ["Private :: Do Not Upload"]

[tool.uv.build-backend]
module-name = "ezllmrouter_client"
