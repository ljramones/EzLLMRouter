services:
  receiver:
    image: ${EZLLMROUTER_RECEIVER_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EZLLMROUTER_RECEIVER_LOG: /data/arrivals.jsonl
      EZLLMROUTER_RECEIVER_MODE: ${EZLLMROUTER_RECEIVER_MODE:-normal}
    volumes: ["receiver_data:/data"]
    networks: [dev01]
  service:
    image: ${EZLLMROUTER_SERVICE_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
    volumes: ["service_data:/data"]
    networks: [dev01]
    depends_on: [receiver]
  service_mutant:
    image: ${EZLLMROUTER_SERVICE_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
      EZLLMROUTER_MUTATE_AFTER_BINDING: "1"
    volumes: ["mutant_data:/data"]
    networks: [dev01]
    depends_on: [receiver]
  service_failstore:
    image: ${EZLLMROUTER_SERVICE_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
      EZLLMROUTER_FAIL_INTENT: "1"
    volumes: ["failstore_data:/data"]
    networks: [dev01]
    depends_on: [receiver]
  driver:
    image: ${EZLLMROUTER_DRIVER_IMAGE:?}
    pull_policy: never
    user: node
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SERVICE_URL: http://service:8765
      EZLLMROUTER_RECEIVER_URL: http://receiver:8766
      EZLLMROUTER_MUTANT_URL: http://service_mutant:8765
      EZLLMROUTER_FAILSTORE_URL: http://service_failstore:8765
      EZLLMROUTER_SUBMISSION_ID: ${EZLLMROUTER_SUBMISSION_ID:-}
    networks: [dev01]
    depends_on: [service, receiver]
networks:
  dev01:
    internal: true
volumes:
  service_data:
  receiver_data:
  mutant_data:
  failstore_data:
