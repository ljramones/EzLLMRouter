x-receiver: &receiver_base
  image: ${EZLLMROUTER_RECEIVER_IMAGE:?}
  pull_policy: never
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [dev02]
x-service: &service_base
  image: ${EZLLMROUTER_SERVICE_IMAGE:?}
  pull_policy: never
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [dev02]
services:
  receiver:
    <<: *receiver_base
    environment: {EZLLMROUTER_RECEIVER_LOG: /data/arrivals.jsonl}
    volumes: ["receiver_data:/data"]
  receiver_delay:
    <<: *receiver_base
    environment: {EZLLMROUTER_RECEIVER_LOG: /data/arrivals.jsonl, EZLLMROUTER_RECEIVER_MODE: delay}
    volumes: ["receiver_delay_data:/data"]
  receiver_fail:
    <<: *receiver_base
    environment: {EZLLMROUTER_RECEIVER_LOG: /data/arrivals.jsonl, EZLLMROUTER_RECEIVER_MODE: fail}
    volumes: ["receiver_fail_data:/data"]
  service:
    <<: *service_base
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_DEV_TOKEN_SECONDARY: ${EZLLMROUTER_DEV_TOKEN_SECONDARY:?}
      EZLLMROUTER_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
    volumes: ["service_data:/data"]
    depends_on: [receiver]
  service_delay:
    <<: *service_base
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SYNTHETIC_URL: http://receiver_delay:8766/v1/chat/completions
    volumes: ["service_delay_data:/data"]
    depends_on: [receiver_delay]
  service_nostore_delay:
    <<: *service_base
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_DEV_NO_STORE: "1"
      EZLLMROUTER_SYNTHETIC_URL: http://receiver_delay:8766/v1/chat/completions
    volumes: ["service_nostore_delay_data:/data"]
    depends_on: [receiver_delay]
  service_nostore_live:
    <<: *service_base
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_DEV_NO_STORE: "1"
      EZLLMROUTER_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
    volumes: ["service_nostore_live_data:/data"]
    depends_on: [receiver]
  service_mutant:
    <<: *service_base
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_MUTATE_AFTER_BINDING: "1"
      EZLLMROUTER_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
    volumes: ["service_mutant_data:/data"]
    depends_on: [receiver]
  service_failstore:
    <<: *service_base
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_FAIL_INTENT: "1"
      EZLLMROUTER_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
    volumes: ["service_failstore_data:/data"]
    depends_on: [receiver]
  service_remote_fail:
    <<: *service_base
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SYNTHETIC_URL: http://receiver_fail:8766/v1/chat/completions
    volumes: ["service_remote_fail_data:/data"]
    depends_on: [receiver_fail]
  service_serial_a:
    <<: *service_base
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
    volumes: ["service_serial_a_data:/data"]
    depends_on: [receiver]
  service_serial_b:
    <<: *service_base
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
    volumes: ["service_serial_b_data:/data"]
    depends_on: [receiver]
  python_consumer:
    image: ${EZLLMROUTER_PYTHON_CLIENT_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_DEV_TOKEN_SECONDARY: ${EZLLMROUTER_DEV_TOKEN_SECONDARY:?}
      EZLLMROUTER_SERVICE_URL: http://service:8765
      EZLLMROUTER_RECEIVER_URL: http://receiver:8766
    networks: [dev02]
  js_consumer:
    image: ${EZLLMROUTER_JS_CLIENT_IMAGE:?}
    pull_policy: never
    user: node
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SERVICE_URL: http://service:8765
      EZLLMROUTER_RECEIVER_URL: http://receiver:8766
      EZLLMROUTER_INSTALLED_CLIENT: "1"
    networks: [dev02]
networks:
  dev02:
    internal: true
volumes:
  receiver_data:
  receiver_delay_data:
  receiver_fail_data:
  service_data:
  service_delay_data:
  service_nostore_delay_data:
  service_nostore_live_data:
  service_mutant_data:
  service_failstore_data:
  service_remote_fail_data:
  service_serial_a_data:
  service_serial_b_data:
