services:
  receiver:
    image: ${EZLLMROUTER_RECEIVER_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment: {EZLLMROUTER_RECEIVER_LOG: /data/arrivals.jsonl}
    volumes: ["receiver_data:/data"]
    networks: [dev03]
  service:
    image: ${EZLLMROUTER_SERVICE_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
    volumes: ["service_data:/data"]
    depends_on: [receiver]
    networks: [dev03]
  service_mutation:
    image: ${EZLLMROUTER_SERVICE_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EZLLMROUTER_DB_PATH: /data/store.sqlite
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
      EZLLMROUTER_MUTATE_AFTER_BINDING: "1"
    volumes: ["mutation_data:/data"]
    depends_on: [receiver]
    networks: [dev03]
  python_consumer:
    image: ${EZLLMROUTER_PYTHON_CLIENT_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SERVICE_URL: http://service:8765
      EZLLMROUTER_RECEIVER_URL: http://receiver:8766
    networks: [dev03]
  js_consumer:
    image: ${EZLLMROUTER_JS_CLIENT_IMAGE:?}
    pull_policy: never
    user: node
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      EZLLMROUTER_DEV_TOKEN: ${EZLLMROUTER_DEV_TOKEN:?}
      EZLLMROUTER_SERVICE_URL: http://service:8765
      EZLLMROUTER_RECEIVER_URL: http://receiver:8766
    networks: [dev03]
networks:
  dev03:
    internal: true
volumes:
  receiver_data:
  service_data:
  mutation_data:
