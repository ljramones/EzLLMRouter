services:
  receiver:
    image: ${DURANKI_RECEIVER_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment: {DURANKI_RECEIVER_LOG: /data/arrivals.jsonl}
    volumes: ["receiver_data:/data"]
    networks: [dev03]
  service:
    image: ${DURANKI_SERVICE_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DURANKI_DB_PATH: /data/store.sqlite
      DURANKI_DEV_TOKEN: ${DURANKI_DEV_TOKEN:?}
      DURANKI_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
    volumes: ["service_data:/data"]
    depends_on: [receiver]
    networks: [dev03]
  service_mutation:
    image: ${DURANKI_SERVICE_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DURANKI_DB_PATH: /data/store.sqlite
      DURANKI_DEV_TOKEN: ${DURANKI_DEV_TOKEN:?}
      DURANKI_SYNTHETIC_URL: http://receiver:8766/v1/chat/completions
      DURANKI_MUTATE_AFTER_BINDING: "1"
    volumes: ["mutation_data:/data"]
    depends_on: [receiver]
    networks: [dev03]
  python_consumer:
    image: ${DURANKI_PYTHON_CLIENT_IMAGE:?}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DURANKI_DEV_TOKEN: ${DURANKI_DEV_TOKEN:?}
      DURANKI_SERVICE_URL: http://service:8765
      DURANKI_RECEIVER_URL: http://receiver:8766
    networks: [dev03]
  js_consumer:
    image: ${DURANKI_JS_CLIENT_IMAGE:?}
    pull_policy: never
    user: node
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DURANKI_DEV_TOKEN: ${DURANKI_DEV_TOKEN:?}
      DURANKI_SERVICE_URL: http://service:8765
      DURANKI_RECEIVER_URL: http://receiver:8766
    networks: [dev03]
networks:
  dev03:
    internal: true
volumes:
  receiver_data:
  service_data:
  mutation_data:
