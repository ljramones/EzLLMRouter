name: Scheduled testing
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeat-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EZLLMROUTER_TEST_SEED: ${{ github.run_number }}
      EZLLMROUTER_TEST_EXAMPLES: '512'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: python3 -m pip install uv==0.13.9
      - run: uv sync --locked --all-groups --python 3.12.15
      - name: Repeat offline and loopback modules five times, retaining every failure
        run: uv run --locked python -m tools.check --tests-only --loopback --repeat 5 --health-dir .artifacts/nightly-health
      - name: Retain every outcome and slowest tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-test-health
          path: .artifacts/nightly-health/
          retention-days: 30
