name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, Node 24
        with:
          node-version-file: .nvmrc
      - name: Validate locked inputs before installing dependencies
        # Check source inputs with the runner's standard library before uv can install them.
        run: python3 -I -S tools/security_dependencies.py
      - name: Scan tracked source and full Git history for secrets
        run: python3 -I -S tools/security_secrets.py
      - name: Install pinned environment manager
        run: 'python3 -m pip install --force-reinstall --only-binary=:all: --no-deps --require-hashes -r .github/requirements-bootstrap.lock'
      - name: Install locked development environment
        run: uv sync --locked --all-groups --python 3.12.15
      - name: Install locked parser for console coverage
        run: npm --prefix tests/playwright ci --ignore-scripts --no-audit --no-fund
      - name: Offline regression and quality checks
        run: uv run --locked python -m tools.check --coverage --coverage-gate --lock-audit --coverage-dir .artifacts/coverage/offline
      - name: Local HTTP regression fixtures
        run: uv run --locked python -m tools.check --http-only --coverage --coverage-gate --lock-audit --coverage-dir .artifacts/coverage/http --coverage-merge .artifacts/coverage/offline
      - name: Uninstrumented offline and HTTP duration checks
        run: uv run --locked python -m tools.check --tests-only --loopback --health-budget 30
      - name: Retain coverage and test health
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-and-http-measurements
          path: |
            .artifacts/coverage/
            .artifacts/test-health/
            .artifacts/security/
          retention-days: 14
  mutation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - name: Validate locked inputs before installing dependencies
        run: python3 -I -S tools/security_dependencies.py
      - name: Install pinned environment manager
        run: 'python3 -m pip install --force-reinstall --only-binary=:all: --no-deps --require-hashes -r .github/requirements-bootstrap.lock'
      - name: Install locked development environment
        run: uv sync --locked --all-groups --python 3.12.15
      - name: Reject surviving, invalid or timed-out critical decision mutations
        run: uv run --locked python -m tools.mutation_check --output .artifacts/mutations/critical
      - name: Retain every mutation outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: critical-mutation-results
          path: |
            .artifacts/mutations/critical/summary.json
            .artifacts/mutations/critical/*/baseline.json
            .artifacts/mutations/critical/*/mutant.json
            .artifacts/mutations/critical/*/baseline.log
            .artifacts/mutations/critical/*/mutant.log
          retention-days: 14
  credential-init:
    # The local profile pins an ARM64 image manifest; use its native architecture.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - name: Real credential initialization with the declared Linux capabilities
        run: python3 -I -S tests/security/check_credential_init.py
  native-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0, Node 24
        with:
          go-version-file: clients/go/.go-version
          cache: false
      - name: Install reviewed Java archive with hash verification
        run: python3 -I -S tools/ci_toolchains.py java
      - name: Native client contract and safety checks
        run: bash tests/client_languages/check.sh
      - name: Native client HTTP fixtures
        run: bash tests/client_languages/check.sh --http
  javascript-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EZLLMROUTER_JS_COVERAGE: ${{ github.workspace }}/.artifacts/javascript-coverage
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, Node 24
        with:
          node-version-file: .nvmrc
      - name: Validate locked inputs before installing dependencies
        run: python3 -I -S tools/security_dependencies.py
      - name: Install locked parser for static SDK function coverage
        run: npm --prefix tests/playwright ci --ignore-scripts --no-audit --no-fund
      - name: Installed JavaScript runtime regressions
        run: python3 -I -S tests/client_languages/check_javascript.py
      - name: Installed JavaScript HTTP fixture
        run: python3 -I -S tests/client_languages/check_javascript.py --http
      - name: Summarize installed SDK coverage
        if: always()
        run: python3 -I -S tools/javascript_coverage.py .artifacts/javascript-coverage --scope sdk
      - name: Retain installed SDK coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: javascript-measurements
          path: .artifacts/javascript-coverage/
          retention-days: 14
  typescript-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, Node 24
        with:
          node-version-file: .nvmrc
      - name: Validate locked inputs before installing dependencies
        run: python3 -I -S tools/security_dependencies.py
      - name: Install locked TypeScript compiler
        run: npm --prefix tests/playwright ci --ignore-scripts --no-audit --no-fund
      - name: Check packaged CommonJS and ESM consumers
        env:
          TSC_BINARY: ${{ github.workspace }}/tests/playwright/node_modules/.bin/tsc
        run: bash tests/client_languages/check_typescript.sh
  dotnet-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - name: Install reviewed .NET SDK archive with hash verification
        run: python3 -I -S tools/ci_toolchains.py dotnet
      - name: Pack and test installed NuGet client
        run: bash clients/dotnet/build.sh test
      - name: Native .NET HTTP fixtures
        run: python3 -I -S tests/client_languages/http_fixture.py --client dotnet
  rust-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/rust-target
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - name: Rust contract, correctness and packaging checks
        run: bash tests/client_languages/check_rust.sh
      - name: Native Rust HTTP fixtures
        run: python3 -I -S tests/client_languages/http_fixture.py --client rust
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, Node 24
        with:
          node-version-file: .nvmrc
      - name: Validate locked inputs before installing dependencies
        run: python3 -I -S tools/security_dependencies.py
      - name: Install pinned environment manager
        run: 'python3 -m pip install --force-reinstall --only-binary=:all: --no-deps --require-hashes -r .github/requirements-bootstrap.lock'
      - name: Install locked service dependencies
        run: uv sync --locked --all-groups --python 3.12.15
      - name: Install locked browser test dependencies
        working-directory: tests/playwright
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser and platform dependencies
        working-directory: tests/playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check browser test types
        working-directory: tests/playwright
        run: npm run typecheck
      - name: Exercise real console and isolated database
        working-directory: tests/playwright
        run: npm test -- --project=${{ matrix.browser }}
      - name: Retain failure report, screenshots and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failures-${{ matrix.browser }}
          path: .artifacts/playwright/
          retention-days: 7
  macos-service:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Validate locked inputs before installing dependencies
        run: python3 -I -S tools/security_dependencies.py
      - name: Install pinned environment manager
        run: 'python3 -m pip install --force-reinstall --only-binary=:all: --no-deps --require-hashes --break-system-packages -r .github/requirements-bootstrap.lock'
      - name: Install locked development environment
        run: python3 -m uv sync --locked --all-groups --python 3.12.15
      - name: Install locked console parser
        run: npm --prefix tests/playwright ci --ignore-scripts --no-audit --no-fund
      - name: macOS service, storage, process and local transport regressions
        run: python3 -m uv run --locked python -m tools.check --tests-only --loopback --lock-audit
      - name: Retain platform test outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-service-results
          path: .artifacts/test-health/
          retention-days: 14
  platform-clients:
    name: Packaged clients (${{ matrix.os }})
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: python3
          - os: windows-2025
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: clients/go/.go-version
          cache: false
      - name: Install reviewed Java archive with hash verification
        run: ${{ matrix.python }} -I -S tools/ci_toolchains.py java
      - name: Install reviewed .NET SDK archive with hash verification
        run: ${{ matrix.python }} -I -S tools/ci_toolchains.py dotnet
      - name: Validate locked inputs before installing dependencies
        run: ${{ matrix.python }} -I -S tools/security_dependencies.py
      - name: Install pinned environment manager
        run: '${{ matrix.python }} -m pip install --force-reinstall --only-binary=:all: --no-deps --require-hashes --break-system-packages -r .github/requirements-bootstrap.lock'
      - name: Install locked Python environment
        run: ${{ matrix.python }} -m uv sync --locked --all-groups --python 3.12.15
      - name: Install locked TypeScript compiler
        run: npm --prefix tests/playwright ci --ignore-scripts --no-audit --no-fund
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - name: Locate existing OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $opensslDir = 'C:\Program Files\Git\usr\bin'
            if (-not (Test-Path "$opensslDir\openssl.exe")) { throw 'OpenSSL is required for the local TLS fixture' }
            $opensslDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Current packages, fresh Unicode paths, contracts and owned HTTP/TLS clients
        run: ${{ matrix.python }} -m uv run --locked python tests/client_languages/platform_check.py
      - name: Retain platform identities and package results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-clients-${{ matrix.os }}
          path: .artifacts/platform-clients/summary.json
          retention-days: 14
