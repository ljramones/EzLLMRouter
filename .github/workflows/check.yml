name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, Node 24
        with:
          node-version-file: .nvmrc
      - name: Install pinned environment manager
        run: python3 -m pip install uv==0.13.9
      - name: Install locked development environment
        run: uv sync --locked --all-groups --python 3.12.15
      - name: Offline regression and quality checks
        run: uv run --locked python -m tools.check
      - name: Local HTTP regression fixtures
        run: uv run --locked python -m tools.check --http-only
  native-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0, Node 24
        with:
          go-version-file: clients/go/.go-version
          cache: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0, Node 24
        with:
          distribution: temurin
          java-version: '17'
      - name: Native client contract and safety checks
        run: bash tests/client_languages/check.sh
      - name: Native client HTTP fixtures
        run: bash tests/client_languages/check.sh --http
  typescript-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, Node 24
        with:
          node-version-file: .nvmrc
      - name: Install TypeScript compiler
        run: npm install --global --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Check packaged CommonJS and ESM consumers
        run: bash tests/client_languages/check_typescript.sh
  dotnet-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-dotnet@v5 # Node 24
        with:
          dotnet-version: '10.0.x'
      - name: Pack and test installed NuGet client
        run: bash clients/dotnet/build.sh test
      - name: Native .NET HTTP fixtures
        run: python3 -I -S tests/client_languages/http_fixture.py --client dotnet
  rust-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/rust-target
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - name: Rust contract, correctness and packaging checks
        run: bash tests/client_languages/check_rust.sh
      - name: Native Rust HTTP fixtures
        run: python3 -I -S tests/client_languages/http_fixture.py --client rust
