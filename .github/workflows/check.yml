name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, Node 24
        with:
          node-version-file: .nvmrc
      - name: Validate locked inputs before installing dependencies
        # Check source inputs with the runner's standard library before uv can install them.
        run: python3 -I -S tools/security_dependencies.py
      - name: Install pinned environment manager
        run: python3 -m pip install uv==0.13.9
      - name: Install locked development environment
        run: uv sync --locked --all-groups --python 3.12.15
      - name: Install locked parser for console coverage
        run: npm --prefix tests/playwright ci --ignore-scripts --no-audit --no-fund
      - name: Offline regression and quality checks
        run: uv run --locked python -m tools.check --coverage --coverage-gate --health-budget 30 --lock-audit --coverage-dir .artifacts/coverage/offline
      - name: Local HTTP regression fixtures
        run: uv run --locked python -m tools.check --http-only --coverage --coverage-gate --lock-audit --health-budget 30 --coverage-dir .artifacts/coverage/http --coverage-merge .artifacts/coverage/offline
      - name: Retain coverage and test health
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-and-http-measurements
          path: |
            .artifacts/coverage/
            .artifacts/test-health/
            .artifacts/security/
          retention-days: 14
  credential-init:
    # The local profile pins an ARM64 image manifest; use its native architecture.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - name: Real credential initialization with the declared Linux capabilities
        run: python3 -I -S tests/security/check_credential_init.py
  native-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0, Node 24
        with:
          go-version-file: clients/go/.go-version
          cache: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0, Node 24
        with:
          distribution: temurin
          java-version: '17'
      - name: Native client contract and safety checks
        run: bash tests/client_languages/check.sh
      - name: Native client HTTP fixtures
        run: bash tests/client_languages/check.sh --http
  javascript-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EZLLMROUTER_JS_COVERAGE: ${{ github.workspace }}/.artifacts/javascript-coverage
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, Node 24
        with:
          node-version-file: .nvmrc
      - name: Validate locked inputs before installing dependencies
        run: python3 -I -S tools/security_dependencies.py
      - name: Install locked parser for static SDK function coverage
        run: npm --prefix tests/playwright ci --ignore-scripts --no-audit --no-fund
      - name: Installed JavaScript runtime regressions
        run: python3 -I -S tests/client_languages/check_javascript.py
      - name: Installed JavaScript HTTP fixture
        run: python3 -I -S tests/client_languages/check_javascript.py --http
      - name: Summarize installed SDK coverage
        if: always()
        run: python3 -I -S tools/javascript_coverage.py .artifacts/javascript-coverage --scope sdk
      - name: Retain installed SDK coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: javascript-measurements
          path: .artifacts/javascript-coverage/
          retention-days: 14
  typescript-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, Node 24
        with:
          node-version-file: .nvmrc
      - name: Install TypeScript compiler
        run: npm install --global --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Check packaged CommonJS and ESM consumers
        run: bash tests/client_languages/check_typescript.sh
  dotnet-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-dotnet@v5 # Node 24
        with:
          dotnet-version: '10.0.x'
      - name: Pack and test installed NuGet client
        run: bash clients/dotnet/build.sh test
      - name: Native .NET HTTP fixtures
        run: python3 -I -S tests/client_languages/http_fixture.py --client dotnet
  rust-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/rust-target
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - name: Rust contract, correctness and packaging checks
        run: bash tests/client_languages/check_rust.sh
      - name: Native Rust HTTP fixtures
        run: python3 -I -S tests/client_languages/http_fixture.py --client rust
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node 24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0, Node 24
        with:
          node-version-file: .nvmrc
      - name: Validate locked inputs before installing dependencies
        run: python3 -I -S tools/security_dependencies.py
      - name: Install pinned environment manager
        run: python3 -m pip install uv==0.13.9
      - name: Install locked service dependencies
        run: uv sync --locked --all-groups --python 3.12.15
      - name: Install locked browser test dependencies
        working-directory: tests/playwright
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser and platform dependencies
        working-directory: tests/playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check browser test types
        working-directory: tests/playwright
        run: npm run typecheck
      - name: Exercise real console and isolated database
        working-directory: tests/playwright
        run: npm test -- --project=${{ matrix.browser }}
      - name: Retain failure report, screenshots and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failures-${{ matrix.browser }}
          path: .artifacts/playwright/
          retention-days: 7
